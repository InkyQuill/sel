[package]
name = "sel-rs"
version = "0.2.2"
description = "Select slices from text files by line numbers, ranges, positions, or regex"
repository = "https://github.com/InkyQuill/sel"
homepage = "https://github.com/InkyQuill/sel"
documentation = "https://docs.rs/sel-rs"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["InkyQuill <inkyquill@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.92"
categories = ["command-line-utilities", "text-processing"]
keywords = ["cli", "grep", "text", "select", "extract"]

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Regular expressions (PCRE2 compatible)
regex = "1.11"

# Better error handling
thiserror = "2.0"

[dev-dependencies]
# Property-based testing
proptest = "1.5"

# Temp file handling in tests
tempfile = "3.14"

# Benchmarking
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# The crate is published to crates.io as `sel-rs` (the short name was
# already taken by an unrelated, abandoned 2019 crate). Override both the
# library and the binary names so end users still write `use sel::...` and
# still run `sel` at the shell.
[lib]
name = "sel"
path = "src/lib.rs"

[[bin]]
name = "sel"
path = "src/main.rs"

[[bench]]
name = "large_file"
harness = false

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.22.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Allow manual edits to the generated CI workflow (needed for our appended
# crates.io publish job, which cargo-dist 0.22 doesn't natively support).
allow-dirty = ["ci"]

# Override cargo-dist 0.22.1's hard-coded matrix runners. The upstream
# defaults (ubuntu-20.04, macos-13, windows-2019) are all retired or
# deprecated GitHub runner images, which caused the release matrix to
# hang waiting for runners that no longer exist.
#
# Note aarch64-unknown-linux-gnu uses the native ARM runner
# (`ubuntu-24.04-arm`) rather than cross-compiling from x86_64. cargo-dist
# 0.22.1 emits no `packages_install` entry for that target, so without
# gcc-aarch64-linux-gnu on the runner the cross-link fails with
# "incompatible with elf64-x86-64". Building natively avoids the whole
# class of toolchain mismatch.
[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
x86_64-pc-windows-msvc = "windows-2022"
