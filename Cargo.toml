[package]
name = "sel"
version = "0.2.0"
description = "Select slices from text files by line numbers, ranges, positions, or regex"
repository = "https://github.com/InkyQuill/sel"
homepage = "https://github.com/InkyQuill/sel"
documentation = "https://docs.rs/sel"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["InkyQuill <inkyquill@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.92"
categories = ["command-line-utilities", "text-processing"]
keywords = ["cli", "grep", "text", "select", "extract"]

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Regular expressions (PCRE2 compatible)
regex = "1.11"

# Better error handling
thiserror = "2.0"

[dev-dependencies]
# Property-based testing
proptest = "1.5"

# Temp file handling in tests
tempfile = "3.14"

# Benchmarking
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[bin]]
name = "sel"
path = "src/main.rs"

[[bench]]
name = "large_file"
harness = false

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.22.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Allow manual edits to the generated CI workflow (needed for our appended
# crates.io publish job, which cargo-dist 0.22 doesn't natively support).
allow-dirty = ["ci"]

# Override cargo-dist 0.22.1's hard-coded matrix runners, all of which are
# now retired GitHub runner images:
#   ubuntu-20.04   -> retired April 2025
#   macos-13       -> deprecated, scheduled for removal
#   windows-2019   -> deprecated
# Upgrading cargo-dist would regenerate these with modern defaults, but
# until then we override per-target here. cargo-dist reads this table at
# `cargo dist plan` time and emits it into the matrix that drives
# build-local-artifacts in release.yml.
[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"
aarch64-unknown-linux-gnu = "ubuntu-24.04"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
x86_64-pc-windows-msvc = "windows-2022"
